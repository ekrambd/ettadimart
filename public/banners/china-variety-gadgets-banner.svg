<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="glowOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7a00"/>
      <stop offset="100%" stop-color="#ff3d00"/>
    </linearGradient>
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDD305"/>
      <stop offset="100%" stop-color="#FFB300"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1000" height="520" rx="20" fill="url(#bgGrad)"/>

  <!-- Ambient Light Circles -->
  <circle cx="820" cy="160" r="180" fill="#ff5722" opacity="0.25" filter="url(#softGlow)"/>
  <circle cx="200" cy="420" r="150" fill="#3b82f6" opacity="0.2" filter="url(#softGlow)"/>

  <!-- Subtle High-Tech Grid Pattern -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="130" x2="1000" y2="130"/>
    <line x1="0" y1="260" x2="1000" y2="260"/>
    <line x1="0" y1="390" x2="1000" y2="390"/>
    <line x1="250" y1="0" x2="250" y2="520"/>
    <line x1="500" y1="0" x2="500" y2="520"/>
    <line x1="750" y1="0" x2="750" y2="520"/>
  </g>

  <!-- Left Content Area -->
  <g transform="translate(60, 60)">
    <!-- Top Pill Badge -->
    <g>
      <rect x="0" y="0" width="360" height="34" rx="17" fill="url(#glowOrange)"/>
      <text x="18" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="900" fill="#ffffff" letter-spacing="1">
        🔥 100% ORIGINAL CHINA IMPORTED
      </text>
    </g>

    <!-- Main Bengali Headline -->
    <text x="0" y="90" font-family="'Hind Siliguri', 'Noto Sans Bengali', sans-serif" font-size="38" font-weight="800" fill="#ffffff" letter-spacing="0.5">
      চায়না থেকে সরাসরি আমদানিকৃত
    </text>

    <!-- Highlighted Product Category -->
    <text x="0" y="148" font-family="'Hind Siliguri', 'Noto Sans Bengali', sans-serif" font-size="44" font-weight="900" fill="#FDD305">
      স্মার্ট গ্যাজেটস ও ভ্যারাইটিজ সমগ্র
    </text>

    <!-- English Subtitle -->
    <text x="0" y="188" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="600" fill="#94a3b8">
      Smart Kitchen • Rechargeable Tools • Daily Utilities • Lifestyle
    </text>

    <!-- Value Proposition Checkmarks -->
    <g transform="translate(0, 225)" font-family="'Hind Siliguri', sans-serif" font-size="15" font-weight="600" fill="#e2e8f0">
      <g transform="translate(0, 0)">
        <circle cx="10" cy="-4" r="8" fill="#10b981"/>
        <path d="M7 -4 L9 -2 L13 -6" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round"/>
        <text x="26" y="0">ফ্যাক্টরি ডিরেক্ট প্রাইসিং</text>
      </g>
      <g transform="translate(190, 0)">
        <circle cx="10" cy="-4" r="8" fill="#10b981"/>
        <path d="M7 -4 L9 -2 L13 -6" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round"/>
        <text x="26" y="0">সারা দেশে ক্যাশ অন ডেলিভারি</text>
      </g>
      <g transform="translate(0, 36)">
        <circle cx="10" cy="-4" r="8" fill="#10b981"/>
        <path d="M7 -4 L9 -2 L13 -6" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round"/>
        <text x="26" y="0">৭ দিনের রিপ্লেসমেন্ট ওয়ারেন্টি</text>
      </g>
      <g transform="translate(190, 36)">
        <circle cx="10" cy="-4" r="8" fill="#10b981"/>
        <path d="M7 -4 L9 -2 L13 -6" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round"/>
        <text x="26" y="0">প্রিমিয়াম টেস্টেড কোয়ালিটি</text>
      </g>
    </g>

    <!-- CTA Button -->
    <g transform="translate(0, 320)">
      <rect x="0" y="0" width="220" height="52" rx="12" fill="url(#btnGrad)"/>
      <text x="32" y="32" font-family="'Plus Jakarta Sans', 'Hind Siliguri', sans-serif" font-size="16" font-weight="900" fill="#0f172a" letter-spacing="0.5">
        SHOP NOW  &rarr;
      </text>
    </g>
  </g>

  <!-- Right Visual Graphics: Modern Smart Gadget Showcase Frame -->
  <g transform="translate(620, 60)">
    <!-- Backdrop Card -->
    <rect x="0" y="0" width="320" height="400" rx="24" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1.5"/>

    <!-- Discount Ribbon -->
    <g transform="translate(190, -10)">
      <rect x="0" y="0" width="120" height="34" rx="8" fill="#ef4444"/>
      <text x="14" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="900" fill="#ffffff">
        UP TO 50% OFF
      </text>
    </g>

    <!-- Gadget Illustration Composition -->
    <!-- Smart Blender / Juicer Silhouette -->
    <g transform="translate(30, 45)">
      <rect x="15" y="20" width="60" height="120" rx="14" fill="#06b6d4" opacity="0.9"/>
      <rect x="25" y="5" width="40" height="20" rx="6" fill="#0891b2"/>
      <circle cx="45" cy="115" r="8" fill="#ffffff" opacity="0.8"/>
      <!-- Measurement lines -->
      <line x1="25" y1="50" x2="45" y2="50" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
      <line x1="25" y1="70" x2="40" y2="70" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
      <line x1="25" y1="90" x2="48" y2="90" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
      <text x="5" y="160" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#94a3b8">USB Blender</text>
    </g>

    <!-- Wireless Charging Dock Illustration -->
    <g transform="translate(145, 55)">
      <rect x="10" y="25" width="85" height="110" rx="16" fill="#3b82f6" opacity="0.85"/>
      <rect x="18" y="35" width="69" height="75" rx="8" fill="#1e293b"/>
      <!-- Lightning on screen -->
      <path d="M54 55 L45 72 L52 72 L48 90 L60 70 L53 70 Z" fill="#FDD305"/>
      <circle cx="52" cy="122" r="5" fill="#10b981"/>
      <text x="10" y="150" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#94a3b8">Fast Charger</text>
    </g>

    <!-- Mini Sealer & Trimmer Badges -->
    <g transform="translate(25, 205)">
      <rect x="0" y="0" width="125" height="75" rx="12" fill="#334155" opacity="0.9"/>
      <!-- Sealer icon -->
      <rect x="20" y="16" width="55" height="28" rx="8" fill="#f59e0b"/>
      <path d="M25 24 L70 24" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
      <text x="15" y="60" font-family="'Hind Siliguri', sans-serif" font-size="11" font-weight="700" fill="#e2e8f0">মিনি হ্যান্ড সিলার</text>
    </g>

    <g transform="translate(165, 205)">
      <rect x="0" y="0" width="125" height="75" rx="12" fill="#334155" opacity="0.9"/>
      <!-- Motion sensor light icon -->
      <circle cx="62" cy="28" r="16" fill="#10b981" opacity="0.8"/>
      <circle cx="62" cy="28" r="8" fill="#ffffff"/>
      <text x="16" y="60" font-family="'Hind Siliguri', sans-serif" font-size="11" font-weight="700" fill="#e2e8f0">স্মার্ট মোশন লাইট</text>
    </g>

    <!-- Bottom Stock Trust Badge -->
    <g transform="translate(25, 305)">
      <rect x="0" y="0" width="265" height="65" rx="14" fill="#0f172a" stroke="#475569" stroke-width="1"/>
      <text x="16" y="28" font-family="'Hind Siliguri', sans-serif" font-size="13" font-weight="700" fill="#FDD305">
        ⚡ রেডি স্টক ইন ঢাকা
      </text>
      <text x="16" y="48" font-family="'Hind Siliguri', sans-serif" font-size="11" font-weight="500" fill="#94a3b8">
        অর্ডার করলেই ২৪ থেকে ৪৮ ঘণ্টায় ডেলিভারি
      </text>
    </g>
  </g>
</svg>
